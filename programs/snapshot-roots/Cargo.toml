[package]
name = "snapshot-roots"
version = "0.1.0"
description = "Where each signer posts the Merkle root of its receivables tokens' snapshots, for programs to verify one token's facts against"
license = "Apache-2.0"
repository = "https://github.com/scriplylabs/scriply-programs"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "snapshot_roots"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
token-snapshot = { path = "../../crates/token-snapshot" }

[dev-dependencies]
litesvm = "0.15.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
